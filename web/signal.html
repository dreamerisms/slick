<title>Signal Survey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Silkscreen&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@800&display=swap">
<style>
/* Layout: full-bleed survey canvas with a 2D annotation layer. The HUD is a flier frame laid over it: wordmark and readouts in the left corners, one control column docked right (bottom sheet in portrait). Tap to hide or show the HUD; drag to orbit, pinch to zoom. */
:root{
  --ink:#0b0806; --fg:#fff1dc; --dim:#a8937f; --line:rgba(255,241,220,.16); --panel:rgba(11,8,6,.76); --volt:#f2b48a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--mono);font-size:11px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) min(340px,48%);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.frame{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vh,64px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase;color:var(--volt);mix-blend-mode:difference}
.mark small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--fg);margin-top:8px;line-height:1.5}
.lowl{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-width:0}
.rlock{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rlock b{font-weight:400;color:var(--dim)}
.rlock svg{width:11px;height:11px;flex:none}
.rlock[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--ink);font-weight:700}
.rlock[aria-pressed="true"] b{color:var(--ink)}
.read{display:flex;flex-wrap:wrap;gap:4px 14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
.read b{font-weight:400;color:var(--dim)}
.hits{display:inline-flex;gap:4px;vertical-align:middle}
.hits i{width:9px;height:9px;border:1px solid var(--fg);opacity:.35}
.hits i.on{background:var(--volt);border-color:var(--volt);opacity:1}
.panel{pointer-events:auto;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:1px solid var(--volt);outline-offset:1px}
.tabs button{flex:1;min-width:0;padding:9px 0;color:var(--dim);font-size:9px;letter-spacing:.04em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--volt);font-weight:700}
.body{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:baseline;letter-spacing:.12em;text-transform:uppercase}
.row output{color:var(--volt);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-moz-range-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-9px;background:var(--volt);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--volt);border:0;border-radius:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{border:1px solid var(--line);padding:7px 9px;font-size:10px;color:var(--fg);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:700}
.lab{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-size:10px}
.grp{display:flex;flex-direction:column;gap:6px}
.cols{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--line);background:none}
input[type=text],select{font:inherit;color:var(--fg);background:rgba(255,241,220,.06);border:1px solid var(--line);padding:8px;width:100%;letter-spacing:.08em;border-radius:0}
.note{color:var(--dim);line-height:1.5;letter-spacing:.04em;font-size:10px}
.note.warn{color:var(--fg)}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2.2fr);border-top:1px solid var(--line)}
.foot button{position:relative;overflow:hidden;padding:11px 6px;font-size:10px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.foot button:first-child{border-left:0}
.foot button::after{content:"";position:absolute;inset:0;background:var(--volt);mix-blend-mode:difference;transform:scaleX(var(--p,0));transform-origin:left;pointer-events:none}
.foot .sw{width:10px;height:10px;border:1px solid var(--fg);flex:none}
.foot .rand{color:var(--volt);font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;background:var(--panel);border:1px solid var(--line);letter-spacing:.14em;text-transform:uppercase;font-size:10px;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100% - 32px);text-align:center}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
@media (max-aspect-ratio:1/1){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 54%}
  .frame{flex-direction:row;align-items:flex-start;gap:12px}
  .read{justify-content:flex-end;text-align:right}
  .lowl{align-items:flex-end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div class="hud" id="hud">
  <div class="frame">
    <div class="mark">Signal<small>SCENE 03 / SURVEY<br>LOOK-DEV BUILD</small></div>
    <div class="lowl">
    <button class="rlock" id="rlock" aria-pressed="false" hidden><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="5.5" width="8" height="5.5"/><path id="shackle" d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg><b>Rotation</b><span>Auto</span></button>
    <div class="read">
      <span><b>FPS</b> <span id="rFps">--</span></span>
      <span><b>NODES</b> <span id="rSim">--</span></span>
      <span><b>IN</b> <span id="rIn">DEMO</span></span>
      <span><b>DRIVE</b> <span id="rTilt">DRAG</span></span>
      <span><b>MOVE</b> <span id="rMove">0.00</span></span>
      <span><b>K S H</b> <span class="hits"><i id="h0"></i><i id="h1"></i><i id="h2"></i></span></span>
    </div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot">
      <button class="slot" data-slot="0" aria-label="Preset 1"><i class="sw"></i>1</button>
      <button class="slot" data-slot="1" aria-label="Preset 2"><i class="sw"></i>2</button>
      <button class="slot" data-slot="2" aria-label="Preset 3"><i class="sw"></i>3</button>
      <button class="rand" id="rand">Hold: Randomize</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="fatal" hidden>This device's browser can't run the survey view (it needs WebGL2).</div>

<script>
(()=>{
'use strict';
/* ---------- scene manifest ---------- */
const P=[
 ['bpm','Demo tempo','source',90,220,174,1],
 ['kick','Kick pulse','react',0,1,.6],['snare','Snare traces','react',0,1,.55],['hat','Hat shimmer','react',0,1,.5],
 ['burst','Impact','react',0,2,1],['flash','Flash','react',0,1,.3],
 ['relief','Relief','terrain',0,2,1],['tscale','Terrain scale','terrain',.4,2,1],['grid','Grid','terrain',0,1,.5],
 ['lattice','Plan lattice','terrain',0,1,.45],['trace','Trace pulses','terrain',0,1,.6],
 ['look','Look-around','motion',0,2,1],['mom','Momentum','motion',0,1,.6],['warp','Road warp','motion',0,2,1],
 ['cruise','Cruise','motion',0,1,.15],['tiltp','Tilt parallax','motion',0,1,.4],['spin','Auto rotate','motion',-1,1,.15],['beatm','Beat motion','motion',0,2,1],
 ['lineb','Line brightness','look',.2,2,1],['glow','Glow','look',.3,4,1.4],['nsize','Node size','look',.5,2,1],
 ['ghost','Faded signals','look',0,1,.45],['cycle','Color cycle','look',0,1,0],
 ['cardHold','Card hold (s)','card',2,30,8,1],['cardGap','Card gap (s)','card',4,90,20,1],['cardSize','Card size','card',.6,1.6,1]
];
const PAL={COPPER:['#f2b48a','#fff1dc','#0b0806'],MONO:['#ffffff','#8f99a3','#040404'],PHOSPHOR:['#9dffcf','#3fd8ff','#020806'],SOLAR:['#ffd36b','#7dff9a','#06070a'],ICE:['#d8ecff','#5a8cff','#03050b']};
const S={cA:PAL.COPPER[0],cB:PAL.COPPER[1],cBg:PAL.COPPER[2],tinv:false,rlock:'',side:'left',card:'change',cdir:'same',src:'demo',sound:false,q:1,tab:'react'};
for(const p of P)S[p[0]]=p[5];
S.mdrive='gyro';
try{Object.assign(S,JSON.parse(localStorage.getItem('signal01')||'{}'));}catch(e){}
S.src='demo';S.sound=false;S.scene='signal';
const save=()=>{try{localStorage.setItem('signal01',JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const NATIVE=window.SlickNative||null;
const LIVE=!!(NATIVE&&NATIVE.startSignals);
try{localStorage.setItem('slickScene','signal');}catch(e){}
const SCENES={slick:'index.html',hyper:'hyper.html',signal:'signal.html',glyph:'glyph.html'};

/* ---------- GL ---------- */
const cv=$('gl'),ov=$('ov'),cx=ov.getContext('2d');
const gl=cv.getContext('webgl2',{alpha:false,antialias:true,powerPreference:'high-performance'});
if(!gl){$('fatal').hidden=false;$('hud').hidden=true;return;}
const NOISE=`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float h1(float n){return fract(sin(n)*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
`;
const VHEAD=`#version 300 es
precision highp float;
uniform mat4 uVP;uniform vec3 uEye;uniform float uTrav,uTime,uPR,uPA,uFog;
const float W=3000.;
${NOISE}
float ringAt(vec3 p){float d=length(p.xz);float k=(d-uPR)/45.;return exp(-k*k)*uPA;}
float fogAt(vec3 p){return exp(-max(distance(p,uEye)-400.,0.)*.0011*uFog);}
`;
const FHEAD=`#version 300 es
precision highp float;
uniform vec3 uC;uniform float uB;out vec4 o;
`;
/* contour terrain: one LINES draw; rows slide toward the viewer while the height field scrolls with travel */
const TER_VS=VHEAD+`
uniform float uRelief,uScale,uBass,uTr;uniform int uRows,uCols;
out float vA,vHot;
float heightAt(vec2 w,vec2 l){float n=fbm(w*.0016*uScale);float pk=pow(max(n-.38,0.)*1.7,1.5);
 float rg=1.-abs(vn(w*.0042*uScale)*2.-1.);
 return (pk*300.+rg*rg*pk*70.)*uRelief*(1.+uBass*.25)*smoothstep(220.,720.,length(l));}
void main(){int id=gl_VertexID;int cpr=uCols-1;int seg=id/2;int e=id-seg*2;int row=seg/cpr;int col=seg-row*cpr+e;
 float dz=W/float(uRows);float x=(float(col)/float(cpr)-.5)*W;float z=-W*.5+float(row)*dz+mod(uTrav,dz);
 float rowW=floor((uTrav-mod(uTrav,dz))/dz+.5)-float(row);
 float hgt=heightAt(vec2(x,z-uTrav),vec2(x,z));vec3 p=vec3(x,hgt,z);
 float edge=smoothstep(W*.5,W*.34,max(abs(x),abs(z)));float fog=fogAt(p);
 float rs=h1(rowW*7.13);float cxp=(fract(rs*13.7+uTime*(.025+.05*h1(rowW*3.1)))-.5)*W*1.1;
 float tr=exp(-pow((x-cxp)/80.,2.))*uTr*step(.45,h1(rowW*1.9));
 float lift=smoothstep(1.,30.,hgt);
 vA=(.14+.86*lift)*edge*fog;vHot=(ringAt(p)+tr)*edge*fog*(.3+.7*lift);
 gl_Position=uVP*vec4(p,1.);}`;
const TER_FS=FHEAD+`in float vA,vHot;void main(){o=vec4(uC*vA*uB*.85+mix(uC,vec3(1),.45)*vHot*1.5,1);}`;
/* ground grid: lines across both axes, the cross lines scroll with travel */
const GRID_VS=VHEAD+`uniform int uN;out vec3 vP;
void main(){int id=gl_VertexID;int ln=id/2;int e=id-ln*2;int dir=ln/uN;int k=ln-dir*uN;float sp=W/float(uN);
 float a=-W*.5+float(k)*sp;float b=(float(e)-.5)*W;
 vec3 p=dir==0?vec3(a,-1.,b):vec3(b,-1.,a+mod(uTrav,sp));vP=p;gl_Position=uVP*vec4(p,1.);}`;
const GRID_FS=`#version 300 es
precision highp float;uniform vec3 uC,uEye;uniform float uB,uPR,uPA,uFog;in vec3 vP;out vec4 o;
void main(){float edge=smoothstep(1500.,900.,max(abs(vP.x),abs(vP.z)));float fog=exp(-max(distance(vP,uEye)-400.,0.)*.0011*uFog);
 float d=length(vP.xz);float k=(d-uPR)/45.;float ring=exp(-k*k)*uPA;
 o=vec4(uC*(uB+ring*.8)*edge*fog,1);}`;
const DOT_VS=VHEAD+`uniform int uN;uniform float uHat,uSeed,uPx;out float vA;
void main(){int id=gl_VertexID;int i=id/uN;int j=id-i*uN;float sp=W/float(uN);
 vec3 p=vec3(-W*.5+float(i)*sp,-1.,-W*.5+float(j)*sp+mod(uTrav,sp));
 float tw=step(.82,h21(vec2(float(i),float(j))+uSeed));
 vA=smoothstep(1500.,900.,max(abs(p.x),abs(p.z)))*fogAt(p)*(1.+ringAt(p)*2.+uHat*tw*3.);
 gl_Position=uVP*vec4(p,1.);gl_PointSize=floor(uPx*(4.+uHat*tw*2.))+1.;}`;
const DOT_FS=FHEAD+`in float vA;void main(){vec2 q=gl_PointCoord;float y=1.-q.y;if(y<.12||y>.86||abs(q.x-.5)>(.86-y)*.5774)discard;o=vec4(uC*uB*vA,1);}`;
/* plan lattice: a Fresco-style top view on the ground under the signal cluster */
const LAT_VS=VHEAD+`in vec3 aP;uniform float uRot;out float vA;
void main(){float c=cos(uRot),s=sin(uRot);vec3 p=vec3(aP.x*c-aP.z*s,.5,aP.x*s+aP.z*c);
 vA=fogAt(p)*(1.+ringAt(p)*3.);gl_Position=uVP*vec4(p,1.);}`;
const LAT_FS=FHEAD+`in float vA;void main(){o=vec4(uC*uB*vA,1);}`;
const FIN_FS=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform float uGrain,uTime;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){vec2 q=uv-.5;float vig=1.-smoothstep(0.,1.,1.-dot(q,q)*1.25);float g=(hash(gl_FragCoord.xy*.7+fract(uTime)*91.)-.5)*uGrain*.12;
 o=vec4(vec3(max(g,0.)),vig*.85);}`;
const QVS=`#version 300 es
out vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0,1);}`;
function compile(vs,fs,attrs){const p=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}
 if(attrs)attrs.forEach((a,i)=>gl.bindAttribLocation(p,i,a));
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
 const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]={l:gl.getUniformLocation(p,a.name),t:a.type};}return{p,u};}
const PR={ter:compile(TER_VS,TER_FS),grid:compile(GRID_VS,GRID_FS),dot:compile(DOT_VS,DOT_FS),lat:compile(LAT_VS,LAT_FS,['aP']),fin:compile(QVS,FIN_FS)};
function use(pr,un){gl.useProgram(pr.p);for(const k in un){const e=pr.u[k];if(!e)continue;const v=un[k],l=e.l;
  if(e.t===gl.INT)gl.uniform1i(l,v);else if(e.t===gl.FLOAT_MAT4)gl.uniformMatrix4fv(l,false,v);
  else if(typeof v==='number')gl.uniform1f(l,v);else if(v.length===2)gl.uniform2f(l,v[0],v[1]);else gl.uniform3f(l,v[0],v[1],v[2]);}}
const VAO0=gl.createVertexArray();
/* lattice geometry: rings, spokes and a triangulated truss between rings */
const LAT=(()=>{const v=[],seg=(a,b)=>v.push(a[0],0,a[1],b[0],0,b[1]),pt=(r,a)=>[Math.cos(a)*r,Math.sin(a)*r];
 const rings=[90,150,215,285,360,440,520,545],sp=36;
 rings.forEach(r=>{const n=Math.max(48,Math.round(r/5));for(let i=0;i<n;i++)seg(pt(r,i/n*6.2832),pt(r,(i+1)/n*6.2832));});
 for(let i=0;i<sp;i++){const a=i/sp*6.2832;seg(pt(rings[0],a),pt(rings[6],a));}
 for(let k=1;k<6;k++)for(let i=0;i<sp;i++){const a=i/sp*6.2832,b=(i+.5)/sp*6.2832,c=(i+1)/sp*6.2832;
  seg(pt(rings[k],a),pt(rings[k+1],b));seg(pt(rings[k+1],b),pt(rings[k],c));}
 for(let i=0;i<120;i++){if(i%10<2)continue;const a=i/120*6.2832;seg(pt(rings[6],a),pt(rings[7],a));}
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindVertexArray(null);
 return{vao,n:v.length/3};})();

const QS=[{rows:40,cols:110,scale:.75,grid:36},{rows:64,cols:170,scale:1,grid:48},{rows:96,cols:240,scale:1,grid:64}];
let RW=0,RH=0,ASP=1,OW=0,OH=0,ODPR=1;
function resize(){const q=QS[S.q];const dpr=Math.min(window.devicePixelRatio||1,2)*q.scale;
 const w=Math.max(2,Math.round(cv.clientWidth*dpr)),h=Math.max(2,Math.round(cv.clientHeight*dpr));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}RW=w;RH=h;ASP=w/h;
 ODPR=Math.min(window.devicePixelRatio||1,2);const ow=Math.round(ov.clientWidth*ODPR),oh=Math.round(ov.clientHeight*ODPR);
 if(ov.width!==ow||ov.height!==oh){ov.width=ow;ov.height=oh;}OW=ov.clientWidth;OH=ov.clientHeight;}

/* ---------- tiny matrix kit ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];},dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lookAt(eye,tg){const f=norm(sub(tg,eye)),r=norm(cross(f,[0,1,0])),u=cross(r,f);

 if(!d.access){el.hidden=false;el.classList.add('ask');npText($('npT'),'Show what’s playing');npText($('npA'),'Tap to allow notification access');npLayout(true);return;}
 el.classList.remove('ask');if(!d.title){el.hidden=true;npLayout(false);return;}
 el.hidden=false;npText($('npT'),d.title);npText($('npA'),d.artist||d.app||'');
 if(d.art!==npArt){npArt=d.art||'';const im=$('npI');im.hidden=!npArt;if(npArt)im.src=npArt;}
 npPlaying=!!d.playing;$('npP').innerHTML=npPlaying?IC.pause:IC.play;$('npP').setAttribute('aria-label',npPlaying?'Pause':'Play');
 const f=d.dur>0?Math.min(1,(d.pos+(npPlaying?1000:0))/d.dur):0;$('npBar').style.width=(f*100).toFixed(2)+'%';npLayout(true);}
if(npOn){const st=document.createElement('style');st.textContent=`.np{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;width:min(470px,calc(100% - 32px));height:62px;box-sizing:border-box;padding:6px 4px 6px 6px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);z-index:4;pointer-events:auto}
.np img{width:48px;height:48px;object-fit:cover;flex:none;display:block}
.np .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.np .t b,.np .t span{display:block;white-space:nowrap;overflow:hidden}.np .mq{display:inline-block;font-style:normal;will-change:transform}
@keyframes npmq{0%,16%{transform:none}84%,100%{transform:translateX(var(--d))}}
.np .t b{font-weight:700}.np .t span{color:var(--dim)}
.np .c{display:flex;flex:none}.np .c button{width:54px;height:50px;display:grid;place-items:center;color:var(--fg)}
.np .c svg{width:20px;height:20px}.np .bar{position:absolute;left:0;bottom:-1px;height:1px;background:var(--volt);width:0;transition:width 1s linear}

@media (min-aspect-ratio:1/1){
 #hud:not([hidden])~.np{left:max(16px,env(safe-area-inset-left,0px));transform:none;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(470px,calc(100% - min(340px,48%) - 48px))}
 .np-on .hud .frame{padding-bottom:var(--npH,0px)}}
@media (max-aspect-ratio:1/1){
 .np{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));transform:none;width:auto}
 .np-on .hud{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px) + var(--npH,0px))}}`;document.head.appendChild(st);
 document.body.insertAdjacentHTML('beforeend',`<div class="np" id="np" hidden><img id="npI" alt="" hidden><div class="t"><b id="npT"></b><span id="npA"></span></div><div class="c"><button id="npB" aria-label="Previous track">${IC.prev}</button><button id="npP" aria-label="Play">${IC.play}</button><button id="npN" aria-label="Next track">${IC.next}</button></div><i class="bar" id="npBar"></i></div>`);
 const cmd=c=>{try{NATIVE.mediaCmd(c);}catch(e){}setTimeout(npPoll,250);};
 $('npB').addEventListener('click',e=>{e.stopPropagation();cmd('prev');});$('npN').addEventListener('click',e=>{e.stopPropagation();cmd('next');});
 $('npP').addEventListener('click',e=>{e.stopPropagation();cmd(npPlaying?'pause':'play');npPlaying=!npPlaying;$('npP').innerHTML=npPlaying?IC.pause:IC.play;});
 $('np').addEventListener('click',()=>{if($('np').classList.contains('ask'))try{NATIVE.openMediaAccess();}catch(e){}});
 setInterval(npPoll,1000);setTimeout(npPoll,300);}

/* ---------- scene cycle: hop between the visuals at random on a timer ---------- */
const CYC_SCENES={slick:'index.html',hyper:'hyper.html',signal:'signal.html',glyph:'glyph.html'};
const CYC_TIMES=[[30,'30 S'],[60,'1 MIN'],[180,'3 MIN'],[300,'5 MIN'],[600,'10 MIN']];
const scy={on:false,secs:180};try{Object.assign(scy,JSON.parse(localStorage.getItem('slickCycle')||'{}'));}catch(e){}
let cycTm=0;
const cycSave=()=>{try{localStorage.setItem('slickCycle',JSON.stringify({on:scy.on,secs:scy.secs}));}catch(e){}};
const cycLabel=()=>(CYC_TIMES.find(c=>c[0]===scy.secs)||[0,scy.secs+' S'])[1];
function cycGo(){const pool=Object.keys(CYC_SCENES).filter(k=>k!==S.scene),v=pool[Math.random()*pool.length|0];
 try{if(S.scene==='signal'&&NATIVE&&NATIVE.stopSignals)NATIVE.stopSignals();}catch(e){}
 try{localStorage.setItem('slickScene',v);}catch(e){}
 try{localStorage.setItem('slickCycHide','1');}catch(e){}
 const f=$('cycFade');if(f){f.style.transition='opacity .6s';f.style.opacity='1';}setTimeout(()=>location.replace(CYC_SCENES[v]),620);}
function cycArm(){clearTimeout(cycTm);if(scy.on&&NATIVE)cycTm=setTimeout(cycGo,scy.secs*1000);}
function cycPaint(){const b=$('cycBtn');if(!b)return;b.setAttribute('aria-pressed',scy.on?'true':'false');b.querySelector('span').textContent=scy.on?cycLabel():'Off';}
/* self-contained: the Source tab can draw before this module has run */
function cycUI(){if(!NATIVE)return'';let secs=180;try{secs=JSON.parse(localStorage.getItem('slickCycle')||'{}').secs||180;}catch(e){}
 return`<div class="grp"><span class="lab">Cycle scenes every</span><div class="seg">${[[30,'30 S'],[60,'1 MIN'],[180,'3 MIN'],[300,'5 MIN'],[600,'10 MIN']].map(([v,l])=>`<button data-scy="${v}" aria-pressed="${secs===v}">${l}</button>`).join('')}</div></div>`;}
if(NATIVE){
 /* fade in from the last scene, and the chip that turns cycling on or off */
 document.body.insertAdjacentHTML('beforeend','<div id="cycFade" style="position:fixed;inset:0;background:#000;opacity:1;pointer-events:none;z-index:9;transition:opacity .7s"></div>');
 setTimeout(()=>{$('cycFade').style.opacity='0';},40);
 /* a cycle hop lands with the HUD hidden so the show runs hands-free */
 try{if(localStorage.getItem('slickCycHide')==='1'){localStorage.removeItem('slickCycHide');$('hud').hidden=true;}}catch(e){}
 const lowl=document.querySelector('.lowl');
 if(lowl){lowl.insertAdjacentHTML('afterbegin','<button class="rlock" id="cycBtn" aria-pressed="false"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M10 6a4 4 0 1 1-1.2-2.85"/><path d="M10 1.5v2.2H7.8"/></svg><b>Cycle</b><span>Off</span></button>');
  $('cycBtn').addEventListener('click',()=>{scy.on=!scy.on;cycSave();cycPaint();cycArm();toast(scy.on?'Cycling scenes every '+cycLabel().toLowerCase():'Scene cycle off');});}
 $('body').addEventListener('click',e=>{const el=e.target.closest('button[data-scy]');if(!el)return;scy.secs=+el.dataset.scy;cycSave();cycPaint();cycArm();paint();});
 cycPaint();cycArm();}

/* readout shows which driver is moving the scene */
setInterval(()=>{const el=$('rTilt');if(!el)return;if(S.mdrive==='beat'){if(el.textContent!=='BEAT'){el.dataset.prev=el.textContent;el.textContent='BEAT';}}else if(el.textContent==='BEAT')el.textContent=el.dataset.prev||'DRAG';},400);
/* ---------- scene strip: the top switch in the panel, one tiny glyph per visual ---------- */
if(NATIVE){const SC=[['slick','≈','Slick'],['hyper','∴','Hyper'],['signal','◎','Signal'],['glyph','▓','Glyph']];
 const st=document.createElement('style');st.textContent=`.scn{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.scn button{padding:8px 2px 7px;font-size:9px;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:5px;border-left:1px solid var(--line);min-width:0}
.scn button:first-child{border-left:0}.scn i{font-style:normal;font-size:13px;line-height:1;color:var(--fg);font-family:var(--mono)}
.scn button[aria-current="true"]{color:var(--volt);font-weight:700;box-shadow:inset 0 -2px 0 var(--volt)}.scn button[aria-current="true"] i{color:var(--volt)}`;document.head.appendChild(st);
 $('tabs').insertAdjacentHTML('beforebegin',`<nav class="scn" id="scn" aria-label="Scene">${SC.map(([k,g,l])=>`<button data-scn="${k}" aria-current="${k===S.scene}"><i aria-hidden="true">${g}</i>${l}</button>`).join('')}</nav>`);
 $('scn').addEventListener('click',e=>{const b=e.target.closest('button[data-scn]');if(!b||b.dataset.scn===S.scene)return;const v=b.dataset.scn;
  try{if(S.scene==='signal'&&NATIVE.stopSignals)NATIVE.stopSignals();}catch(x){}try{localStorage.setItem('slickScene',v);}catch(x){}
  const f=$('cycFade');if(f){f.style.transition='opacity .35s';f.style.opacity='1';}setTimeout(()=>location.replace(CYC_SCENES[v]),370);});}

/* ---------- frame loop ---------- */
let last=performance.now()/1000,fpsS=60,fpsT=0,moveT=0,trav=0,tspeed=0,yawPrev=0,cyc=0,CA=S.cA,CB=S.cB;
function shiftH(hx,dh){const[r,g,b]=hexs(hx),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
 if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=(mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4)*60;}return[h+dh,s*100,l*100];}
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
addEventListener('resize',resize);resize();
function frame(nowMs){requestAnimationFrame(frame);const t=nowMs/1000,fdt=Math.min(.05,Math.max(.001,t-last));last=t;
 fpsS+=(1/fdt-fpsS)*.05;if(t-fpsT>.5){fpsT=t;$('rFps').textContent=Math.round(fpsS);}
 if(cv.clientWidth*cv.clientHeight===0)return;resize();
 seq();analyse(t);flash*=Math.pow(.02,fdt);
 const now=performance.now();if(LIVE)liveStep(now);else demoStep(now);
 const sg=S.tinv?-1:1,D2R=Math.PI/180,mom=S.mom;
 const beat=S.mdrive==='beat';
 if(mot.gyro&&!beat){const gy=-mot.rot[0]*D2R*S.look*sg*1.2;cam.yawV+=gy*fdt*(1-mom);if(!ptr.on)cam.spin+=gy*fdt*mom*1.4;cam.pitchV+=-mot.rot[1]*D2R*S.look*sg*fdt*.6;}
 const gr=tiltSeen&&!beat?[mot.g[0]*sg,mot.g[1]*sg]:[0,-1];for(let i=0;i<2;i++)gBase[i]+=(gr[i]-gBase[i])*Math.min(1,fdt/4);
 const tilt=[(gr[0]-gBase[0])*S.tiltp,(gr[1]-gBase[1])*S.tiltp];
 cam.yaw+=cam.yawV;cam.pitch+=cam.pitchV;cam.yawV=0;cam.pitchV=0;cam.yaw*=Math.exp(-fdt*.35);cam.pitch*=Math.exp(-fdt*.5);
 if(!ptr.on&&cam.spin!==0){const kl=.035+(1-mom)*3,kc=.012+(1-mom)*.6,sgn=Math.sign(cam.spin);cam.spin-=(kl*cam.spin+sgn*kc)*fdt;if(Math.sign(cam.spin)!==sgn)cam.spin=0;}
 cam.orbit+=S.spin*.12*fdt+cam.spin*fdt+cam.drag;cam.drag=0;
 cyc=(cyc+S.cycle*fdt*45)%360;CA=S.cycle>0?hsl(...shiftH(S.cA,cyc)):S.cA;CB=S.cycle>0?hsl(...shiftH(S.cB,S.cdir==='opposite'?-cyc:cyc)):S.cB;
 const yaw=cam.orbit+cam.yaw+tilt[0]*.8,pitch=Math.max(.06,Math.min(1.35,.42+cam.pitch-tilt[1]*.5));
 const T=[0,40,0],eye=[T[0]+cam.dist*Math.sin(yaw)*Math.cos(pitch),T[1]+cam.dist*Math.sin(pitch),T[2]+cam.dist*Math.cos(yaw)*Math.cos(pitch)];
 VPm=mul(persp(50*D2R,ASP,5,6000),lookAt(eye,T));
 /* moving through the survey: road vibration plus Cruise */
 const road=beat?Math.max(0,lvl[0]-.2)*1.2*S.beatm*S.warp:Math.max(0,(mot.energy-.08)*2.2)*S.warp;tspeed+=(Math.min(1.6,road+S.cruise)-tspeed)*Math.min(1,fdt*1.2);trav+=tspeed*520*fdt;
 if(t-moveT>.25){moveT=t;$('rMove').textContent=(beat?lvl[0]:mot.energy).toFixed(2);}
 fx.pR+=900*fdt;fx.pA*=Math.exp(-fdt*1.6);fx.tr*=Math.exp(-fdt*1.8);fx.hat*=Math.exp(-fdt*9);
 const q=QS[S.q],bg=hexs(S.cBg),ca=hexs(CA),cb=hexs(CB),mixc=ca.map((v,i)=>v*.65+cb[i]*.35),B=S.lineb*(1+flash*.8);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,RW,RH);gl.clearColor(bg[0],bg[1],bg[2],1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.bindVertexArray(VAO0);
 const com={uVP:VPm,uEye:eye,uTrav:trav,uTime:t,uPR:fx.pR,uPA:fx.pA,uFog:.5};
 if(S.grid>.01){use(PR.grid,{...com,uN:q.grid,uC:mixc,uB:.11*S.grid*B});gl.drawArrays(gl.LINES,0,q.grid*2*2);
  use(PR.dot,{...com,uN:q.grid,uC:mixc,uB:.55*S.grid*B,uHat:fx.hat,uSeed:fx.seed,uPx:RH/700});gl.drawArrays(gl.POINTS,0,q.grid*q.grid);}
 if(S.lattice>.01){use(PR.lat,{...com,uRot:t*.01,uC:cb,uB:.16*S.lattice*B});gl.bindVertexArray(LAT.vao);gl.drawArrays(gl.LINES,0,LAT.n);gl.bindVertexArray(VAO0);}
 use(PR.ter,{...com,uRelief:S.relief,uScale:S.tscale,uBass:lvl[0],uTr:S.trace*(.3+fx.tr),uRows:q.rows,uCols:q.cols,uC:mixc,uB:.55*B});
 gl.drawArrays(gl.LINES,0,q.rows*(q.cols-1)*2);
 gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);use(PR.fin,{uGrain:0,uTime:t});gl.drawArrays(gl.TRIANGLES,0,3);gl.disable(gl.BLEND);
 drawOverlay(now,fdt);}
requestAnimationFrame(frame);
})();
