<title>Slick Liquid Visualizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@800&display=swap">
<style>
/* Layout: full-bleed liquid canvas. The HUD is a flier frame laid over it: wordmark and readouts in the left corners, one control column docked right (bottom sheet in portrait). Tap the liquid to hide or show the HUD. */
:root{
  --ink:#040604; --fg:#eaffe1; --dim:#8fa38a; --line:rgba(234,255,225,.16); --panel:rgba(4,6,4,.74); --volt:#7dff2a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--mono);font-size:11px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) min(340px,48%);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.frame{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vh,64px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase;color:var(--volt);mix-blend-mode:difference}
.mark small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--fg);margin-top:8px;line-height:1.5}
.lowl{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-width:0}
.rlock{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rlock b{font-weight:400;color:var(--dim)}
.rlock svg{width:11px;height:11px;flex:none}
.rlock[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--ink);font-weight:700}
.rlock[aria-pressed="true"] b{color:var(--ink)}
.read{display:flex;flex-wrap:wrap;gap:4px 14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
.read b{font-weight:400;color:var(--dim)}
.hits{display:inline-flex;gap:4px;vertical-align:middle}
.hits i{width:9px;height:9px;border:1px solid var(--fg);opacity:.35}
.hits i.on{background:var(--volt);border-color:var(--volt);opacity:1}
.panel{pointer-events:auto;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:1px solid var(--volt);outline-offset:1px}
.tabs button{padding:11px 0;color:var(--dim);font-size:10px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--volt);font-weight:700}
.body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:baseline;letter-spacing:.12em;text-transform:uppercase}
.row output{color:var(--volt);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-moz-range-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-9px;background:var(--volt);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--volt);border:0;border-radius:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{border:1px solid var(--line);padding:8px 10px;font-size:10px;color:var(--fg);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:700}
.lab{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-size:10px}
.grp{display:flex;flex-direction:column;gap:8px}
.cols{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--line);background:none}
input[type=text],select{font:inherit;color:var(--fg);background:rgba(234,255,225,.06);border:1px solid var(--line);padding:8px;width:100%;letter-spacing:.08em;border-radius:0}
.note{color:var(--dim);line-height:1.6;letter-spacing:.04em}
.note.warn{color:var(--fg)}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2.2fr);border-top:1px solid var(--line)}
.foot button{position:relative;overflow:hidden;padding:11px 6px;font-size:10px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.foot button:first-child{border-left:0}
.foot button::after{content:"";position:absolute;inset:0;background:var(--volt);mix-blend-mode:difference;transform:scaleX(var(--p,0));transform-origin:left;pointer-events:none}
.foot .sw{width:10px;height:10px;border:1px solid var(--fg);flex:none}
.foot .rand{color:var(--volt);font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;background:var(--panel);border:1px solid var(--line);letter-spacing:.14em;text-transform:uppercase;font-size:10px;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100% - 32px);text-align:center}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
@media (max-aspect-ratio:1/1){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 54%}
  .frame{flex-direction:row;align-items:flex-start;gap:12px}
  .read{justify-content:flex-end;text-align:right}
  .lowl{align-items:flex-end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="gl"></canvas>
<div class="hud" id="hud">
  <div class="frame">
    <div class="mark">Slick<small>SCENE 01 / LIQUID<br>LOOK-DEV BUILD</small></div>
    <div class="lowl">
    <button class="rlock" id="rlock" aria-pressed="false" hidden><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="5.5" width="8" height="5.5"/><path id="shackle" d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg><b>Rotation</b><span>Auto</span></button>
    <div class="read">
      <span><b>FPS</b> <span id="rFps">--</span></span>
      <span><b>SIM</b> <span id="rSim">--</span></span>
      <span><b>IN</b> <span id="rIn">DEMO</span></span>
      <span><b>TILT</b> <span id="rTilt">DRAG</span></span>
      <span><b>K S H</b> <span class="hits"><i id="h0"></i><i id="h1"></i><i id="h2"></i></span></span>
    </div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot">
      <button class="slot" data-slot="0" aria-label="Preset 1"><i class="sw"></i>1</button>
      <button class="slot" data-slot="1" aria-label="Preset 2"><i class="sw"></i>2</button>
      <button class="slot" data-slot="2" aria-label="Preset 3"><i class="sw"></i>3</button>
      <button class="rand" id="rand">Hold: Randomize</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="fatal" hidden>This device's browser can't run the liquid simulation (it needs WebGL2 with float render targets).</div>

<script>
(()=>{
'use strict';
/* ---------- scene manifest: every control, with the safe range that keeps the look intact ---------- */
const P=[
 ['bpm','Demo tempo','source',90,220,174,1],
 ['kick','Kick drops','react',0,1,.6],['snare','Snare voids','react',0,1,.6],['hat','Hat beads','react',0,1,.5],
 ['size','Drop size','react',.4,2,1],['burst','Impact force','react',0,2,.8],['flash','Flash','react',0,1,.4],
 ['fill','Liquid / void','liquid',.15,.8,.42],['grav','Gravity','liquid',0,2,0],['edge','Ooze edge','liquid',0,1,.4],['stir','Current','liquid',0,1,.35],['visc','Thickness','liquid',0,1,.35],
 ['rip','Ripple depth','liquid',0,2,1],['rwide','Ripple width','liquid',0,1,.6],['ring','Ring time','liquid',0,1,.6],['tilt','Slosh','liquid',0,2,1],
 ['memb','Membrane','look',0,1,.6],['gloss','Gloss','look',0,1.5,.8],['iri','Iridescence','look',0,1,.12],
 ['glow','Glow','look',0,1.5,.6],['bgLvl','Backdrop level','look',0,1.5,.6],['bgMove','Backdrop motion','look',0,1,.3],
 ['bgScale','Pattern scale','look',.3,3,1],
 ['tsize','Size','text',.08,.6,.3],['topac','Opacity','text',0,1,.92],['tdrift','Drift / looseness','text',0,1,.3],['tsub','Submerge','text',0,1,.5],['tpulse','Beat ripples','text',0,1,.6]
];
const PAL={ACID:['#7dff2a','#00c8a0','#eaff00'],MAGMA:['#ff5a1e','#b01408','#ffd21e'],UV:['#b44cff','#1a3cff','#00f0ff'],CHROME:['#cfe0ff','#6a4cff','#ff7ad9']};
const BLENDS=['normal','add','screen','multiply','overlay','difference'];
const BGS=['ink','solid','gradient','caustic','halftone','grid','checker'];
const FONTS={POSTER:'900 380px "Big Shoulders Display"',WIDE:'800 300px "Unbounded"',MONO:'700 320px "JetBrains Mono"'};
const S={cA:PAL.ACID[0],cB:PAL.ACID[1],cC:PAL.ACID[2],cT:'#f2fff0',cD:'#123a24',bgMode:'ink',tinv:false,rlock:'',tmode:'float',ton:true,str:'SCENE 01',font:'POSTER',blend:'normal',src:'demo',sound:false,q:1,tab:'react'};
for(const p of P)S[p[0]]=p[5];
try{Object.assign(S,JSON.parse(localStorage.getItem('slick01')||'{}'));}catch(e){}
S.src='demo';S.sound=false;S.scene='slick';
if(!['ink','solid','gradient','caustic','halftone','grid','checker'].includes(S.bgMode))S.bgMode='ink';
try{indexedDB.deleteDatabase('slick');}catch(e){}
const save=()=>{try{localStorage.setItem('slick01',JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const NATIVE=window.SlickNative||null;
let SCENE='slick';try{SCENE=localStorage.getItem('slickScene')||'slick';}catch(e){}
if(NATIVE&&['hyper','signal','glyph'].includes(SCENE)){location.replace(SCENE+'.html');return;}

/* ---------- GL ---------- */
const cv=$('gl');
const gl=cv.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance',desynchronized:true});
if(!gl||!(gl.getExtension('EXT_color_buffer_float')||gl.getExtension('EXT_color_buffer_half_float'))){$('fatal').hidden=false;$('hud').hidden=true;return;}
const VS=`#version 300 es
out vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0,1);}`;
const HEAD=`#version 300 es
precision highp float;precision highp sampler2D;
in vec2 uv;out vec4 o;
uniform vec2 px;uniform float asp,uTon,dt,uTime;uniform sampler2D uT;uniform vec4 uTx;uniform vec4 uS[8];uniform vec4 uK[8];
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float tmask(vec2 u,float lod){vec2 l=(vec2(u.x*asp,u.y)-uTx.xy)/uTx.zw+.5;if(uTon<.5||l.x<0.||l.y<0.||l.x>1.||l.y>1.)return 0.;return textureLod(uT,l,lod).r;}
float sg(int i){vec2 d=vec2((uv.x-uS[i].x)*asp,uv.y-uS[i].y);return exp(-dot(d,d)/(uS[i].z*uS[i].z));}
float sgk(int i,float k){vec2 d=vec2((uv.x-uS[i].x)*asp,uv.y-uS[i].y);float r=uS[i].z*k;return exp(-dot(d,d)/(r*r));}
`;
const F={
cpy:`uniform sampler2D uX;void main(){o=textureLod(uX,uv,0.);}`,
init:`void main(){vec2 q=vec2(uv.x*asp,uv.y);float n=noise(q*2.6+3.)*.65+noise(q*6.5)*.35;o=vec4(smoothstep(.5,.57,n),noise(q*4.+9.),0,1);}`,
/* velocity: advect, two-liquid buoyancy under tilt, ambient current, impact bursts, finger, text drag */
adv:`uniform sampler2D uV,uC;uniform float uVisc,uStir,uPa;uniform vec2 uG,uTv;uniform vec4 uPtr;
void main(){vec2 v=textureLod(uV,uv,0.).xy;vec2 p=uv-dt*v*vec2(1./asp,1.);v=textureLod(uV,p,0.).xy*uVisc;
float c=textureLod(uC,uv,0.).r,mean=textureLod(uC,vec2(.5),12.).r;
v+=dt*uG*(c-mean)*3.;
vec2 q=vec2(uv.x*asp,uv.y)*2.3+vec2(uTime*.03,-uTime*.021);float e=.06;
v+=dt*uStir*vec2(noise(q+vec2(0,e))-noise(q-vec2(0,e)),noise(q-vec2(e,0))-noise(q+vec2(e,0)))/(2.*e);
for(int i=0;i<8;i++){vec2 d=vec2((uv.x-uS[i].x)*asp,uv.y-uS[i].y);v+=uK[i].z*uS[i].w*sg(i)*d/uS[i].z;}
vec2 d=vec2((uv.x-uPtr.x)*asp,uv.y-uPtr.y);v=mix(v,uPtr.zw,uPa*exp(-dot(d,d)/.006));
v=mix(v,uTv,tmask(uv,2.5));
if(uv.x<px.x||uv.x>1.-px.x)v.x=0.;if(uv.y<px.y||uv.y>1.-px.y)v.y=0.;
o=vec4(clamp(v,-4.,4.),0,1);}`,
div:`uniform sampler2D uV;void main(){o=vec4(.5*(textureLod(uV,uv+vec2(px.x,0),0.).x-textureLod(uV,uv-vec2(px.x,0),0.).x+textureLod(uV,uv+vec2(0,px.y),0.).y-textureLod(uV,uv-vec2(0,px.y),0.).y));}`,
jac:`uniform sampler2D uP,uD;void main(){o=vec4((textureLod(uP,uv+vec2(px.x,0),0.).x+textureLod(uP,uv-vec2(px.x,0),0.).x+textureLod(uP,uv+vec2(0,px.y),0.).x+textureLod(uP,uv-vec2(0,px.y),0.).x-textureLod(uD,uv,0.).x)*.25);}`,
grad:`uniform sampler2D uP,uV;void main(){vec2 v=textureLod(uV,uv,0.).xy;v-=.5*vec2(textureLod(uP,uv+vec2(px.x,0),0.).x-textureLod(uP,uv-vec2(px.x,0),0.).x,textureLod(uP,uv+vec2(0,px.y),0.).x-textureLod(uP,uv-vec2(0,px.y),0.).x);o=vec4(v,0,1);}`,
/* two liquids that refuse to mix: advect, then a bistable reaction re-sharpens the boundary; fill level self-balances */
con:`uniform sampler2D uV,uC;uniform float uFill,uDif;
void main(){vec2 v=textureLod(uV,uv,0.).xy;vec2 p=uv-dt*v*vec2(1./asp,1.);vec4 C=textureLod(uC,p,0.);float c=C.r,g=C.g;
float lap=textureLod(uC,p+vec2(px.x,0),0.).r+textureLod(uC,p-vec2(px.x,0),0.).r+textureLod(uC,p+vec2(0,px.y),0.).r+textureLod(uC,p-vec2(0,px.y),0.).r-4.*c;
float mean=textureLod(uC,vec2(.5),12.).r;float bias=clamp((uFill-mean)*4.,-.45,.45);
c+=uDif*lap+.3*c*(1.-c)*(c-.5+bias);
for(int i=0;i<8;i++){float s=sg(i)*uS[i].w;c+=uK[i].x*s;g+=uK[i].w*s;}
g=g*.9985+.0015*noise(vec2(uv.x*asp,uv.y)*5.+uTime*.05);
o=vec4(clamp(c,0.,1.),clamp(g,0.,1.),0,1);}`,
/* surface ripples: wave equation, rings reflect off the screen edge and off the letterforms */
wav:`uniform sampler2D uH;uniform float uDamp,uFirst,uRw,uTxHit;uniform vec2 uGd,uTv;
float nb(vec2 off,float h){vec2 u=uv+off;return tmask(u,2.5)>.5?h:textureLod(uH,u,0.).x;}
void main(){vec2 hw=textureLod(uH,uv,0.).xy;float h=hw.x,w=hw.y;float m=tmask(uv,2.5);
float s=nb(vec2(px.x,0),h)+nb(vec2(-px.x,0),h)+nb(vec2(0,px.y),h)+nb(vec2(0,-px.y),h);
w+=.34*(s-4.*h);w*=uDamp;h=mix(h,s*.25,.03+.1*uRw);
if(uFirst>.5){for(int i=0;i<8;i++)w+=uK[i].y*uS[i].w*sgk(i,1.+1.6*uRw);
 w+=uTxHit*clamp(tmask(uv,5.)*1.6-m,0.,1.)*1.4;
 w+=dot(uGd,vec2((uv.x-.5)*asp,uv.y-.5));
 w+=(m-tmask(uv-uTv*.06*vec2(1./asp,1.),2.5))*length(uTv)*.05;}
h+=w;h*=.9997;if(m>.5){h*=.85;w*=.85;}
o=vec4(clamp(h,-40.,40.),clamp(w,-20.,20.),0,1);}`,
/* shading: wet-glass normals from ripples + liquid bulge, neon membrane, halo, film iridescence, text layer */
ren:`uniform sampler2D uC,uH;uniform vec3 cA,cB,cC,cT,cD;uniform float uMemb,uGloss,uIri,uGlow,uGrain,uRip,uFlash,uBass,uTop,uSub,uBlend,uEdge,uRw,uBgMode,uBgLvl,uBgMove,uPat,uPin;
vec3 backdrop(vec2 u){vec2 q=vec2(u.x*asp,u.y);float t=uTime*uBgMove;
 if(uBgMode<.5)return vec3(0);
 if(uBgMode<1.5)return cD*uBgLvl;
 if(uBgMode<2.5){float r=length(q-vec2(asp*.5,.5)+.12*vec2(sin(t*.7),cos(t*.5)));return mix(cD,cD*.06,smoothstep(.05,.95,r))*uBgLvl*1.3;}
 if(uBgMode<3.5){vec2 p=q*3.2*uPat;float c=0.;for(int i=0;i<3;i++){float f=float(i);p+=vec2(sin(p.y*1.7+t*1.3+f),cos(p.x*1.3-t*1.1+f*1.7))*.6;c+=.06/abs(sin(p.x)*sin(p.y)+.02);}return cD*min(c*c*.08,3.)*uBgLvl;}
 if(uBgMode<4.5){vec2 g=q*26.*uPat;vec2 f=fract(g)-.5;float rr=.18+.16*sin(q.x*2.6+t*2.)+.12*sin(q.y*3.4-t*1.6);return cD*smoothstep(rr+.06,rr,length(f))*uBgLvl*1.4;}
 if(uBgMode<5.5){vec2 g=q*9.*uPat+vec2(0,t*.8);vec2 d=abs(fract(g)-.5);float l=smoothstep(.465,.5,max(d.x,d.y));return cD*(l*.9+.05)*uBgLvl*1.3;}
 if(uBgMode<6.5){vec2 c=q-vec2(asp*.5,.5);float a=t*.5;c=mat2(cos(a),sin(a),-sin(a),cos(a))*c;vec2 cl=floor(c*5.*uPat);return cD*(.04+.96*mod(cl.x+cl.y,2.))*uBgLvl*1.3;}
 return vec3(0);}
vec3 blendT(vec3 col,float tm){vec3 b=cT;
 if(uBlend>4.5)b=abs(col-cT);else if(uBlend>3.5)b=mix(2.*col*cT,1.-2.*(1.-col)*(1.-cT),step(.5,col));else if(uBlend>2.5)b=col*cT;else if(uBlend>1.5)b=1.-(1.-col)*(1.-cT);else if(uBlend>.5)b=min(col+cT,1.);
 return mix(col,b,tm);}
float Ht(vec2 u){return textureLod(uH,u,0.).x*uRip*.5+smoothstep(.2,.8,textureLod(uC,u,0.).r)*1.5;}
void main(){vec2 su=uv;
vec2 e=px*(1.3+2.2*uRw);
vec3 n=normalize(vec3(Ht(su-vec2(e.x,0))-Ht(su+vec2(e.x,0)),Ht(su-vec2(0,e.y))-Ht(su+vec2(0,e.y)),1.1));
vec4 C=textureLod(uC,su,0.);float c=C.r,pig=C.g,h=textureLod(uH,su,0.).x;
float liq=smoothstep(.35,.65,c),ed=(c-.5)*mix(8.,2.2,uEdge),edge=exp(-ed*ed),halo=textureLod(uC,su,3.5).r,near=textureLod(uC,su,2.2).r,rim=1.-smoothstep(.6,1.,near);
vec3 L=normalize(vec3(-.45,.6,.65)),Hh=normalize(L+vec3(0,0,1));
float dif=clamp(dot(n,L),0.,1.),spec=pow(max(dot(n,Hh),0.),80.),fres=pow(1.-n.z,1.5);
vec3 body=mix(cA,cC,smoothstep(.3,.75,pig));

/* ---------- frame loop: fixed 120 Hz simulation ticks, one render per display frame ---------- */

  uMemb:S.memb,uGloss:S.gloss,uIri:S.iri,uGlow:S.glow,uGrain:0,uRip:S.rip,uFlash:flash,uBass:lvl[0],uTop:S.topac,uSub:S.tsub,uBlend:BLENDS.indexOf(S.blend),uTon:S.ton?1:0,cD:hex(S.cD),uEdge:S.edge,uRw:S.rwide,
