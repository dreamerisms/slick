<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>Hyper Particle Field</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@800&display=swap">
<style>
/* Layout: full-bleed particle canvas. The HUD is a flier frame laid over it: wordmark and readouts in the left corners, one control column docked right (bottom sheet in portrait). Tap the field to hide or show the HUD; drag to orbit. */
:root{
  --ink:#0b0910; --fg:#f2eaff; --dim:#9a8fae; --line:rgba(242,234,255,.16); --panel:rgba(11,9,16,.74); --volt:#da1fff;

}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--mono);font-size:11px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) min(340px,48%);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.frame{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vh,64px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase;color:var(--volt);mix-blend-mode:difference}
.mark small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--fg);margin-top:8px;line-height:1.5}
.lowl{display:flex;flex-direction:column;gap:9px;align-items:flex-start;min-width:0}
.rlock{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:7px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.rlock b{font-weight:400;color:var(--dim)}
.rlock svg{width:11px;height:11px;flex:none}
.rlock[aria-pressed="true"]{background:var(--volt);border-color:var(--volt);color:var(--ink);font-weight:700}
.rlock[aria-pressed="true"] b{color:var(--ink)}
.read{display:flex;flex-wrap:wrap;gap:4px 14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
.read b{font-weight:400;color:var(--dim)}
.hits{display:inline-flex;gap:4px;vertical-align:middle}
.hits i{width:9px;height:9px;border:1px solid var(--fg);opacity:.35}
.hits i.on{background:var(--volt);border-color:var(--volt);opacity:1}
.panel{pointer-events:auto;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:1px solid var(--volt);outline-offset:1px}
.tabs button{padding:11px 0;color:var(--dim);font-size:9px;letter-spacing:.06em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--volt);font-weight:700}
.body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:baseline;letter-spacing:.12em;text-transform:uppercase}
.row output{color:var(--volt);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-moz-range-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-9px;background:var(--volt);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--volt);border:0;border-radius:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{border:1px solid var(--line);padding:8px 10px;font-size:10px;color:var(--fg);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:700}
.lab{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-size:10px}
.grp{display:flex;flex-direction:column;gap:8px}
.cols{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--line);background:none}
input[type=text],select{font:inherit;color:var(--fg);background:rgba(242,234,255,.06);border:1px solid var(--line);padding:8px;width:100%;letter-spacing:.08em;border-radius:0}
.note{color:var(--dim);line-height:1.6;letter-spacing:.04em}
.note.warn{color:var(--fg)}
.foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2.2fr);border-top:1px solid var(--line)}
.foot button{position:relative;overflow:hidden;padding:11px 6px;font-size:10px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.foot button:first-child{border-left:0}
.foot button::after{content:"";position:absolute;inset:0;background:var(--volt);mix-blend-mode:difference;transform:scaleX(var(--p,0));transform-origin:left;pointer-events:none}
.foot .sw{width:10px;height:10px;border:1px solid var(--fg);flex:none}
.foot .rand{color:var(--volt);font-weight:700}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;background:var(--panel);border:1px solid var(--line);letter-spacing:.14em;text-transform:uppercase;font-size:10px;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100% - 32px);text-align:center}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
@media (max-aspect-ratio:1/1){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 54%}
  .frame{flex-direction:row;align-items:flex-start;gap:12px}
  .read{justify-content:flex-end;text-align:right}
  .lowl{align-items:flex-end}
}

const SIM32=(()=>{if(!extF)return false;const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,1,1,0,gl.RGBA,gl.FLOAT,null);

const VS=`#version 300 es
out vec2 uv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));uv=p;gl_Position=vec4(p*2.-1.,0,1);}`;
const FHEAD=`#version 300 es

in vec2 uv;out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
`;
/* 4D simplex noise with derivatives (Ashima Arts, MIT) and curl, as used by the dddylan.com hero */
const SNOISE4=`
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}float mod289(float x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}float permute(float x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}float taylorInvSqrt(float r){return 1.79284291400159-.85373472095314*r;}
vec4 grad4(float j,vec4 ip){const vec4 ones=vec4(1,1,1,-1);vec4 p,s;p.xyz=floor(fract(vec3(j)*ip.xyz)*7.)*ip.z-1.;p.w=1.5-dot(abs(p.xyz),ones.xyz);s=vec4(lessThan(p,vec4(0)));p.xyz=p.xyz+(s.xyz*2.-1.)*s.www;return p;}
vec4 snoise4(vec4 v){const vec4 C=vec4(.138196601125011,.276393202250021,.414589803375032,-.447213595499958);
 vec4 i=floor(v+dot(v,vec4(.309016994374947451)));vec4 x0=v-i+dot(i,C.xxxx);vec4 i0;vec3 isX=step(x0.yzw,x0.xxx);vec3 isYZ=step(x0.zww,x0.yyz);
 i0.x=isX.x+isX.y+isX.z;i0.yzw=1.-isX;i0.y+=isYZ.x+isYZ.y;i0.zw+=1.-isYZ.xy;i0.z+=isYZ.z;i0.w+=1.-isYZ.z;
 vec4 i3=clamp(i0,0.,1.),i2=clamp(i0-1.,0.,1.),i1=clamp(i0-2.,0.,1.);
 vec4 x1=x0-i1+C.xxxx,x2=x0-i2+C.yyyy,x3=x0-i3+C.zzzz,x4=x0+C.wwww;i=mod289(i);
 float j0=permute(permute(permute(permute(i.w)+i.z)+i.y)+i.x);
 vec4 j1=permute(permute(permute(permute(i.w+vec4(i1.w,i2.w,i3.w,1.))+i.z+vec4(i1.z,i2.z,i3.z,1.))+i.y+vec4(i1.y,i2.y,i3.y,1.))+i.x+vec4(i1.x,i2.x,i3.x,1.));
 vec4 ip=vec4(1./294.,1./49.,1./7.,0.);
 vec4 p0=grad4(j0,ip),p1=grad4(j1.x,ip),p2=grad4(j1.y,ip),p3=grad4(j1.z,ip),p4=grad4(j1.w,ip);
 vec4 nr=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;p4*=taylorInvSqrt(dot(p4,p4));
 vec3 v0=vec3(dot(p0,x0),dot(p1,x1),dot(p2,x2));vec2 v1=vec2(dot(p3,x3),dot(p4,x4));
 vec3 m0=max(.5-vec3(dot(x0,x0),dot(x1,x1),dot(x2,x2)),0.);vec2 m1=max(.5-vec2(dot(x3,x3),dot(x4,x4)),0.);
 vec3 t0=-6.*m0*m0*v0;vec2 t1=-6.*m1*m1*v1;vec3 q0=m0*m0*m0;vec2 q1=m1*m1*m1;
 float dx=t0[0]*x0.x+t0[1]*x1.x+t0[2]*x2.x+t1[0]*x3.x+t1[1]*x4.x+q0[0]*p0.x+q0[1]*p1.x+q0[2]*p2.x+q1[0]*p3.x+q1[1]*p4.x;
 float dy=t0[0]*x0.y+t0[1]*x1.y+t0[2]*x2.y+t1[0]*x3.y+t1[1]*x4.y+q0[0]*p0.y+q0[1]*p1.y+q0[2]*p2.y+q1[0]*p3.y+q1[1]*p4.y;
 float dz=t0[0]*x0.z+t0[1]*x1.z+t0[2]*x2.z+t1[0]*x3.z+t1[1]*x4.z+q0[0]*p0.z+q0[1]*p1.z+q0[2]*p2.z+q1[0]*p3.z+q1[1]*p4.z;
 float dw=t0[0]*x0.w+t0[1]*x1.w+t0[2]*x2.w+t1[0]*x3.w+t1[1]*x4.w+q0[0]*p0.w+q0[1]*p1.w+q0[2]*p2.w+q1[0]*p3.w+q1[1]*p4.w;
 return vec4(dx,dy,dz,dw)*49.;}
vec3 curl(vec3 p,float t,float persistence,int oct){vec4 xN=vec4(0),yN=vec4(0),zN=vec4(0);
 for(int i=0;i<3;i++){if(i>=oct)break;float tp=pow(2.,float(i));float sc=.5*tp*pow(persistence,float(i));
  xN+=snoise4(vec4(p*tp,t))*sc;yN+=snoise4(vec4((p+vec3(123.4,129845.6,-1239.1))*tp,t))*sc;zN+=snoise4(vec4((p+vec3(-9519.,9051.,-123.))*tp,t))*sc;}

`;
const SIM=`#version 300 es
precision highp float;precision highp sampler2D;
uniform sampler2D uPos;uniform float uTime,uDelta,uSpeed,uCurlSize,uDieSpeed,uRadius,uCoh;uniform int uOct;
out vec4 o;

void main(){ivec2 ij=ivec2(gl_FragCoord.xy);vec2 uv=gl_FragCoord.xy/vec2(textureSize(uPos,0));
 vec4 inf=texelFetch(uPos,ij,0);vec3 p=inf.xyz;float life=inf.w-uDieSpeed*uDelta;const vec3 A=vec3(0,30,0);
 if(life<.01){float a1=fract(sin(dot(uv,vec2(12.9898,78.233))+uTime)*43758.5453),a2=fract(sin(dot(uv,vec2(39.346,11.135))+uTime)*22578.1459),a3=fract(sin(dot(uv,vec2(73.156,52.971))+uTime)*31415.9265);
  float th=a1*6.28318,ph=acos(2.*a2-1.),r=pow(a3,.3333)*300.*uRadius;p=vec3(r*sin(ph)*cos(th),r*sin(ph)*sin(th),r*cos(ph))+A;life=.5+a1*.5;}
 else{p+=curl(p*uCurlSize,uTime*.3,1.2+(1.-life)*.35,uOct)*uSpeed*uDelta;
  vec3 toA=A-p;float da=length(toA);if(da>1.)p+=normalize(toA)*min(da*.0008*uCoh,.5*uCoh)*uDelta;}
 o=vec4(p,life);}`;
/* particles: read the sim by vertex id, apply the draw-time warps, streak along screen velocity */
const PVS=`#version 300 es
precision highp float;precision highp sampler2D;
uniform sampler2D uPos,uPrev;uniform int uW;uniform mat4 uVP,uV;uniform vec2 uRes;
uniform float uSize,uMotion,uMDist,uMaxPt,uPx,uFog,uHatSeed,uSwell;
uniform vec3 uFwd,uOff,uOffP;uniform vec4 uShock;uniform vec2 uTw,uTrav;
out float vLife,vMix,vBase,vPt,vFade,vHat;out vec2 vVel;
const vec3 A=vec3(0,30,0);const float L=650.;
float h1(float n){return fract(sin(n)*43758.5453);}
vec3 warp(vec3 p,vec3 off,float R,float Am,float tw,float trav,out float s2){vec3 d=p-A;float r=length(d);
 if(abs(tw)>1e-4){float ang=tw/(1.+r/140.);float c=cos(ang),s=sin(ang);d=d*c+cross(uFwd,d)*s+uFwd*dot(uFwd,d)*(1.-c);}

 return A+d;}
void main(){int id=gl_VertexID;ivec2 ij=ivec2(id%uW,id/uW);vec4 cur=texelFetch(uPos,ij,0),prv=texelFetch(uPrev,ij,0);
 float sw,swp;vec3 p=warp(cur.xyz,uOff,uShock.x,uShock.y,uTw.x,uTrav.x,sw),pp=warp(prv.xyz,uOffP,uShock.z,uShock.w,uTw.y,uTrav.y,swp);
 vec4 mv=uV*vec4(p,1.),clip=uVP*vec4(p,1.),clipP=uVP*vec4(pp,1.);
 float life=cur.w;vLife=life;vMix=smoothstep(-200.,200.,p.y)*.7+life*.3;
 float base=uSize*uSwell*smoothstep(0.,.15,life)*(300./max(-mv.z,1.))*(.8+.4*h1(float(id)*.37))*uPx;base=max(base,1.);
 vec2 s0=clip.xy/max(clip.w,1e-4),s1=clipP.xy/max(clipP.w,1e-4);vec2 vel=(s0-s1)*.5*uRes*uMotion;
 if(length(p-pp)>120.||length(cur.xyz-prv.xyz)>60.)vel=vec2(0);
 float vl=length(vel);if(vl>uMDist)vel*=uMDist/vl;
 vVel=vel;vBase=base*.5;float size=min(base+length(vel),uMaxPt);vPt=size;
 vFade=smoothstep(L,L*.72,abs(sw))*exp(-max(-mv.z-500.,0.)*.0016*uFog);
 vHat=step(.86,h1(float(id)*1.13+uHatSeed));

const PFS=`#version 300 es
precision highp float;

  h+=`<div class="cols"><input type="color" id="cT" value="${S.cT}" aria-label="Text color"><span class="lab">Text color</span></div>`;}
 for(const p of P)if(p[2]===S.tab)h+=`<label class="row" for="p_${p[0]}"><span>${p[1]}</span><output id="o_${p[0]}">${fmt(p,S[p[0]])}</output><input type="range" id="p_${p[0]}" data-p="${p[0]}" min="${p[3]}" max="${p[4]}" step="${p[6]||.01}" value="${S[p[0]]}"></label>`;
 $('body').innerHTML=h;}
const fmt=(p,v)=>p[6]===1?String(Math.round(v)):Math.round((v-p[3])/(p[4]-p[3])*100)+'';
$('tabs').addEventListener('click',e=>{const t=e.target.dataset.tab;if(t){S.tab=t;save();paint();}});
$('body').addEventListener('input',e=>{const el=e.target;
 if(el.dataset.p){const p=P.find(x=>x[0]===el.dataset.p);S[p[0]]=parseFloat(el.value);$('o_'+p[0]).textContent=fmt(p,S[p[0]]);}
 else if(el.type==='color'){S[el.id]=el.value;if(el.id==='cA')document.documentElement.style.setProperty('--volt',S.cA);}
 else if(el.id==='str'){S.str=el.value;drawText();}
 save();});
$('body').addEventListener('change',e=>{if(e.target.id==='file')useFile(e.target.files[0]);});
$('body').addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;
 if(el.dataset.pal){[S.cA,S.cB,S.cBg]=PAL[el.dataset.pal];}
 else if(el.id==='fs'){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()||Promise.reject()).catch(()=>note('Fullscreen is not available in this view.',1));return;}
 else if(el.id==='reset'){for(const p of P)S[p[0]]=p[5];}
 else if(el.id==='copyset'){
  const code='HYP1.'+btoa(unescape(encodeURIComponent(JSON.stringify(lookOf()))));$('code').value=code;
  Promise.resolve().then(()=>navigator.clipboard.writeText(code)).then(()=>note('Settings copied. Paste the code into Hyper on your other device.'),()=>{$('code').select();note('Select and copy the code in the box.');});return;}
 else if(el.id==='applyset'){try{const raw=$('code').value.trim();if(!raw.startsWith('HYP1.'))throw 0;applyLook(JSON.parse(decodeURIComponent(escape(atob(raw.slice(5))))));note('Look loaded.');}catch(x){note('That code could not be read. Hyper codes start with HYP1.',1);}return;}
 else if(el.dataset.set){const k=el.dataset.set;let v=el.dataset.val;
  if(k==='scene'){if(v==='slick'){try{localStorage.setItem('slickScene','slick');}catch(x){}location.replace('index.html');}return;}
  if(k==='src'){if(NATIVE&&(v==='phone'||v==='capture')){note(v==='capture'?'Asking Android for capture permission...':'Starting phone audio...');NATIVE.start(v==='phone'?'vis':'cap');return;}
   if(NATIVE)NATIVE.stop();if(v==='mic'){useMic();return;}if(v==='track'){audio();$('file').click();return;}stopSrc();setSrc('demo');return;}
  if(k==='sound'){S.sound=v==='true';if(S.sound)audio();note(S.sound?'Demo beat is audible and driving the hit detection.':'');}
  else if(k==='ton')S.ton=v==='true';else if(k==='tinv')S.tinv=v==='true';
  else if(k==='tmode'){S.tmode=v;if(v==='float'){const L=Math.hypot(tvel[0],tvel[1]);tvel=L>.01?[tvel[0]/L*.13,tvel[1]/L*.13]:[.11,.07];}}else if(k==='q'){S.q=+v;resize();}else{S[k]=v;if(k==='font')drawText();}}
 else return;
 save();paint();});
paint();
/* ---------- looks: one serializer for codes and presets ---------- */
function lookOf(){const o={};for(const k in S)if(!['src','sound','tab','_note','_warn'].includes(k))o[k]=S[k];return o;}
function applyLook(o){for(const p of P)if(typeof o[p[0]]==='number')S[p[0]]=Math.min(p[4],Math.max(p[3],o[p[0]]));
 for(const k of['cA','cB','cBg','cT'])if(/^#[0-9a-f]{6}$/i.test(o[k]||''))S[k]=o[k];
 for(const k of['str','font','blend','tmode'])if(typeof o[k]==='string')S[k]=o[k].slice(0,28);
 for(const k of['ton','tinv'])if(typeof o[k]==='boolean')S[k]=o[k];
 if([0,1,2].includes(o.q)&&o.q!==S.q){S.q=o.q;resize();}
 drawText();save();paint();}
let presets=[null,null,null];try{const v=JSON.parse(localStorage.getItem('hyper01p')||'null');if(Array.isArray(v))presets=v.slice(0,3);}catch(e){}
const savePresets=()=>{try{localStorage.setItem('hyper01p',JSON.stringify(presets));}catch(e){}};
function paintSlots(){document.querySelectorAll('.slot').forEach(b=>{const p=presets[+b.dataset.slot],sw=b.querySelector('.sw');
 sw.style.background=p?p.cA:'transparent';sw.style.borderColor=p?p.cA:'';b.title=p?'Tap to load, hold to overwrite':'Tap to save the current look';});}
let toastT=0;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1600);}
/* hold gesture: a fill sweeps across the button; let go early and it counts as a tap */
function holdable(el,ms,onHold,onTap){let tm=0,raf=0,done=false,active=false;
 const reset=()=>{active=false;clearTimeout(tm);cancelAnimationFrame(raf);el.style.setProperty('--p',0);};
 el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(x){}done=false;active=true;const t0=performance.now();
  const step=()=>{if(!active)return;el.style.setProperty('--p',Math.min(1,(performance.now()-t0)/ms));raf=requestAnimationFrame(step);};step();
  tm=setTimeout(()=>{done=true;reset();onHold();},ms);});
 el.addEventListener('pointerup',()=>{const tap=active&&!done;reset();if(tap&&onTap)onTap();});
 el.addEventListener('pointercancel',reset);el.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('click',e=>{if(e.detail===0)(onTap||onHold)();});}
document.querySelectorAll('.slot').forEach(b=>{const i=+b.dataset.slot;
 const store=()=>{presets[i]=lookOf();savePresets();paintSlots();toast('Saved to preset '+(i+1));};
 holdable(b,600,store,()=>{if(presets[i]){applyLook(presets[i]);toast('Preset '+(i+1));}else store();});});
paintSlots();
const hsl=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const f=n=>{const k=(n+h/30)%12,c=l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);};
function randomize(){
 /* the field, its reactions and its look; text, audio source and motion response stay as they are */
 const keep=new Set(['bpm','tsize','topac','tdrift','look','inertia','warp','cruise','tiltp','bright']);
 for(const p of P){if(keep.has(p[0])||p[6]===1)continue;const r=.1+.8*Math.random();S[p[0]]=+(p[3]+(p[4]-p[3])*r).toFixed(5);}
 S.kick=.45+Math.random()*.4;S.snare=.4+Math.random()*.45;S.hat=.3+Math.random()*.5;
 S.curl=+(.0004+Math.random()*.0016).toFixed(5);S.psize=3+Math.random()*7;S.die=Math.random()<.4?0:+(Math.random()*.008).toFixed(4);
 const h=Math.random()*360,sch=[[150,0],[100,0],[180,0],[60,0],[200,0]][Math.random()*5|0];
 S.cA=hsl(h,100,58);S.cB=hsl(h+sch[0],100,55);S.cBg=hsl(h+200,35,6+Math.random()*5);
 save();paint();toast('Randomized');}
holdable($('rand'),600,randomize,()=>toast('Hold to randomize'));

/* ---------- in-app rotation lock (native only; ignores the phone's own lock) ---------- */
const rl=$('rlock');
function paintLock(){rl.setAttribute('aria-pressed',S.rlock?'true':'false');rl.querySelector('span').textContent=S.rlock?'Locked':'Auto';
 rl.querySelector('#shackle').setAttribute('d',S.rlock?'M4 5.5V4a2 2 0 0 1 4 0v1.5':'M4 5.5V4a2 2 0 0 1 4 0');}
if(NATIVE&&NATIVE.setOrientation){rl.hidden=false;paintLock();try{NATIVE.setOrientation(S.rlock||'auto');}catch(e){}
 rl.addEventListener('click',()=>{try{if(S.rlock){S.rlock='';NATIVE.setOrientation('auto');toast('Rotation unlocked');}
  else{S.rlock=String(NATIVE.currentOrientation());NATIVE.setOrientation(S.rlock);toast('Rotation locked');}}catch(e){}save();paintLock();});}
/* keep a capture session alive across scene switches; otherwise start phone audio */
if(NATIVE)setTimeout(()=>{let route='';try{route=String(NATIVE.read()).split(',')[5]||'';}catch(e){}
 if(route==='capture')window.__slickStatus('cap','running','Capturing phone audio at full quality.');else{note('Starting phone audio...');NATIVE.start('vis');}},400);
if(!SIM32)note('This GPU only offers half-precision float targets, so motion may look slightly stepped.',1);

/* ---------- frame loop ---------- */
const cam={orbit:0,yaw:0,pitch:0,yawV:0,pitchV:0};
const inert={o:[0,0,0],v:[0,0,0]};let offPrev=[0,0,0];
const wrp={trav:0,travP:0,speed:0};const SPAN=1300;
let last=performance.now()/1000,fpsS=60,fpsT=0,moveT=0;
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
addEventListener('resize',resize);resize();
function frame(nowMs){requestAnimationFrame(frame);const t=nowMs/1000,fdt=Math.min(.05,Math.max(.001,t-last));last=t;
 fpsS+=(1/fdt-fpsS)*.05;if(t-fpsT>.5){fpsT=t;$('rFps').textContent=Math.round(fpsS);}
 if(cv.clientWidth*cv.clientHeight===0)return;resize();
 seq();analyse(t);flash*=Math.pow(.02,fdt);
 const sg=S.tinv?-1:1,D2R=Math.PI/180;

 /* look-around: gyro rates spin the view through a turn, then it eases back to center */
 if(mot.gyro){cam.yawV+=-mot.rot[0]*D2R*S.look*sg*fdt*1.2;cam.pitchV+=-mot.rot[1]*D2R*S.look*sg*fdt*.8;}
 const gr=tiltSeen?[mot.g[0]*sg,mot.g[1]*sg]:[0,-1];
 for(let i=0;i<2;i++)gBase[i]+=(gr[i]-gBase[i])*Math.min(1,fdt/4);
 const tilt=[(gr[0]-gBase[0])*S.tiltp,(gr[1]-gBase[1])*S.tiltp];
 cam.yaw+=cam.yawV;cam.pitch+=cam.pitchV;cam.yawV=0;cam.pitchV=0;
 cam.yaw*=Math.exp(-fdt*.35);cam.pitch*=Math.exp(-fdt*.6);cam.pitch=Math.max(-1.1,Math.min(1.1,cam.pitch));
 cam.orbit+=S.orbit*fdt*.09;
 const yaw=cam.orbit+cam.yaw+tilt[0]*.9,pitch=.08+Math.sin(t*.15)*.05+cam.pitch-tilt[1]*.7;
 const T=[0,30,0],RAD=620,eye=[T[0]+RAD*Math.sin(yaw)*Math.cos(pitch),T[1]+RAD*Math.sin(pitch),T[2]+RAD*Math.cos(yaw)*Math.cos(pitch)];
 const V=lookAt(eye,T),Pm=persp(45*D2R,ASP,10,5000),VP=mul(Pm,V.m);

 /* inertia: g-forces shove the cloud on a spring; braking surges it forward, turns slosh it sideways */
 const a=mot.acc,k=10,c=4,gain=220*S.inertia*sg;
 for(let i=0;i<3;i++){inert.v[i]+=(-k*inert.o[i]-c*inert.v[i]-a[i]*gain)*fdt;inert.o[i]+=inert.v[i]*fdt;inert.o[i]=Math.max(-240,Math.min(240,inert.o[i]));}
 const o=inert.o,off=[0,1,2].map(i=>V.r[i]*o[0]+V.u[i]*o[1]-V.f[i]*o[2]);

 /* warp: road vibration (plus Cruise) streams the field toward you; it coasts to a full wrap so the cloud re-forms */
 const road=Math.max(0,(mot.energy-.08)*2.2)*S.warp;
 const target=Math.min(1.6,road+S.cruise);wrp.speed+=(target-wrp.speed)*Math.min(1,fdt*1.5);
 if(wrp.trav>SPAN*1000){wrp.trav%=SPAN;}
 wrp.travP=wrp.trav;let v=wrp.speed*700;const rem=wrp.trav%SPAN;
 if(target<.02&&rem>.5){v=Math.max(v,240);const next=wrp.trav-rem+SPAN;
  if(wrp.trav+v*fdt>=next){wrp.trav=next;v=0;}}
 wrp.trav+=v*fdt;
 if(t-moveT>.25){moveT=t;$('rMove').textContent=(mot.energy).toFixed(2);}

 /* music: shockwave shell, twist, sparkle */
 fx.shRp=fx.shR;fx.shAp=fx.shA;fx.shR+=650*fdt;fx.shA*=Math.exp(-fdt*2.4);
 fx.twP=fx.tw;fx.twV+=(-fx.tw*6-fx.twV*3.2)*fdt;fx.tw+=fx.twV*fdt;fx.tw+=mot.rot[2]*D2R*fdt*.6*S.look*sg;
 fx.hat*=Math.exp(-fdt*10);

 /* text overlay motion */
 const th=S.tsize,tw=th*4,hx=tHalf[0]*th,hy=tHalf[1]*th,sp=S.tdrift*.5;
 if(S.ton&&S.tmode==='pinned')tpos=[ASP/2,.5];
 else if(S.ton&&S.tmode==='tether'){const kk=2.5+14*(1-S.tdrift),cx=ASP/2;
  const ax=-kk*(tpos[0]-cx)-2.4*tvel[0]+gr[0]*2.2+o[0]*.004,ay=-kk*(tpos[1]-.5)-2.4*tvel[1]+gr[1]*2.2+o[1]*.004;
  tvel[0]+=ax*fdt;tvel[1]+=ay*fdt;tpos[0]+=tvel[0]*fdt;tpos[1]+=tvel[1]*fdt;
  if(ASP>2*hx){if(tpos[0]<hx){tpos[0]=hx;tvel[0]=Math.abs(tvel[0])*.4;}if(tpos[0]>ASP-hx){tpos[0]=ASP-hx;tvel[0]=-Math.abs(tvel[0])*.4;}}else tpos[0]=cx;
  if(tpos[1]<hy){tpos[1]=hy;tvel[1]=Math.abs(tvel[1])*.4;}if(tpos[1]>1-hy){tpos[1]=1-hy;tvel[1]=-Math.abs(tvel[1])*.4;}}
 else if(S.ton){const vx=tvel[0]*sp/.13,vy=tvel[1]*sp/.13;tpos[0]+=vx*fdt;tpos[1]+=vy*fdt;
  if(tpos[0]<hx&&ASP>2*hx){tpos[0]=hx;tvel[0]=Math.abs(tvel[0]);}if(tpos[0]>ASP-hx&&ASP>2*hx){tpos[0]=ASP-hx;tvel[0]=-Math.abs(tvel[0]);}
  if(ASP<=2*hx)tpos[0]=ASP/2;
  if(tpos[1]<hy){tpos[1]=hy;tvel[1]=Math.abs(tvel[1]);}if(tpos[1]>1-hy){tpos[1]=1-hy;tvel[1]=-Math.abs(tvel[1]);}}

 /* simulate */
 const q=QS[S.q],dt60=Math.min(3,fdt*60),swell=1+lvl[0]*S.pump*.6;
 gl.disable(gl.BLEND);
 pass(PR.sim,simB,simW,simH,{uPos:simA.t,uTime:t,uDelta:dt60,uSpeed:S.speed*(1+lvl[0]*S.pump),uCurlSize:S.curl,uDieSpeed:S.die,uRadius:S.radius,uCoh:S.coh,uOct:q.oct});
 const prev=simA;simA=simB;simB=prev;

 /* draw particles additively into the HDR scene buffer */
 gl.bindFramebuffer(gl.FRAMEBUFFER,scene.fb);gl.viewport(0,0,RW,RH);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(PR.pts.p);
 set(PR.pts,{uPos:simA.t,uPrev:simB.t,uW:simW,uVP:VP,uV:V.m,uRes:[RW,RH],uSize:S.psize,uMotion:S.mblur>0?S.mblur:0,uMDist:S.mdist*(RH/900),uMaxPt:MAXPT,
  uPx:Math.min(RW,RH)/820,uFog:S.fog,uHatSeed:fx.hatSeed,uSwell:swell,uFwd:V.f,uOff:off,uOffP:offPrev,uShock:[fx.shR,fx.shA,fx.shRp,fx.shAp],uTw:[fx.tw,fx.twP],uTrav:[wrp.trav%SPAN,wrp.travP%SPAN],
  uC1:hexs(S.cA),uC2:hexs(S.cB),uSamples:q.samp,uBright:S.bright*(1+flash*1.2),uHat:fx.hat});
 gl.drawArrays(gl.POINTS,0,simW*simH);gl.disable(gl.BLEND);offPrev=off;

 /* bloom at quarter resolution */
 const bl=S.bloom>.01;
 if(bl){pass(PR.down,bA,bA.w,bA.h,{uX:scene.t,uTx:[1/RW,1/RH]});
  for(let i=0;i<2;i++){const r=S.bloomR*(1+i);pass(PR.blur,bB,bB.w,bB.h,{uX:bA.t,uDir:[r/bA.w,0]});pass(PR.blur,bA,bA.w,bA.h,{uX:bB.t,uDir:[0,r/bA.h]});}}
 pass(PR.comp,null,cv.width,cv.height,{uScene:scene.t,uBloom:bA.t,uT:textTex,cBg:hexs(S.cBg),cT:hexs(S.cT),uTx:[tpos[0],tpos[1],tw,th],asp:ASP,uTon:S.ton?1:0,
  uBloomAmt:bl?S.bloom:0,uGrain:S.grain,uFlash:flash*.3,uTime:t,uTop:S.topac,uBlend:BLENDS.indexOf(S.blend)});}
requestAnimationFrame(frame);
})();
