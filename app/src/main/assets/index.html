<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>Slick Liquid Visualizer</title>

<style>
/* Layout: full-bleed liquid canvas. The HUD is a flier frame laid over it: wordmark and readouts in the left corners, one control column docked right (bottom sheet in portrait). Tap the liquid to hide or show the HUD. */
:root{
  --ink:#040604; --fg:#eaffe1; --dim:#8fa38a; --line:rgba(234,255,225,.16); --panel:rgba(4,6,4,.74); --volt:#7dff2a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--mono);font-size:11px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) min(340px,48%);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.frame{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mark{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vh,64px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase;color:var(--volt);mix-blend-mode:difference}
.mark small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.22em;color:var(--fg);margin-top:8px;line-height:1.5}
.read{display:flex;flex-wrap:wrap;gap:4px 14px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000}
.read b{font-weight:400;color:var(--dim)}
.hits{display:inline-flex;gap:4px;vertical-align:middle}
.hits i{width:9px;height:9px;border:1px solid var(--fg);opacity:.35}
.hits i.on{background:var(--volt);border-color:var(--volt);opacity:1}
.panel{pointer-events:auto;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:1px solid var(--volt);outline-offset:1px}
.tabs button{padding:11px 0;color:var(--dim);font-size:9px;letter-spacing:.08em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--volt);font-weight:700}
.body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:baseline;letter-spacing:.12em;text-transform:uppercase}
.row output{color:var(--volt);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-moz-range-track{height:1px;background:var(--fg);opacity:.5}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-9px;background:var(--volt);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--volt);border:0;border-radius:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{border:1px solid var(--line);padding:8px 10px;font-size:10px;color:var(--fg);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:700}
.lab{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;font-size:10px}
.grp{display:flex;flex-direction:column;gap:8px}
.cols{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{width:40px;height:26px;padding:0;border:1px solid var(--line);background:none}
input[type=text],select{font:inherit;color:var(--fg);background:rgba(234,255,225,.06);border:1px solid var(--line);padding:8px;width:100%;letter-spacing:.08em;border-radius:0}
.note{color:var(--dim);line-height:1.6;letter-spacing:.04em}
.note.warn{color:var(--fg)}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.7}
@media (max-aspect-ratio:1/1){
  .hud{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 54%}
  .frame{flex-direction:row;align-items:flex-start;gap:12px}
  .read{justify-content:flex-end;text-align:right}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

`;
const F={
init:`void main(){vec2 q=vec2(uv.x*asp,uv.y);float n=noise(q*2.6+3.)*.65+noise(q*6.5)*.35;o=vec4(smoothstep(.5,.57,n),noise(q*4.+9.),0,1);}`,
/* velocity: advect, two-liquid buoyancy under tilt, ambient current, impact bursts, finger, text drag */
adv:`uniform sampler2D uV,uC;uniform float uVisc,uStir,uPa;uniform vec2 uG,uTv;uniform vec4 uPtr;
void main(){vec2 v=textureLod(uV,uv,0.).xy;vec2 p=uv-dt*v*vec2(1./asp,1.);v=textureLod(uV,p,0.).xy*uVisc;
float c=textureLod(uC,uv,0.).r,mean=textureLod(uC,vec2(.5),12.).r;

v+=dt*uStir*vec2(noise(q+vec2(0,e))-noise(q-vec2(0,e)),noise(q-vec2(e,0))-noise(q+vec2(e,0)))/(2.*e);
for(int i=0;i<8;i++){vec2 d=vec2((uv.x-uS[i].x)*asp,uv.y-uS[i].y);v+=uK[i].z*uS[i].w*sg(i)*d/uS[i].z;}
vec2 d=vec2((uv.x-uPtr.x)*asp,uv.y-uPtr.y);v=mix(v,uPtr.zw,uPa*exp(-dot(d,d)/.006));

o=vec4(clamp(v,-4.,4.),0,1);}`,
div:`uniform sampler2D uV;void main(){o=vec4(.5*(textureLod(uV,uv+vec2(px.x,0),0.).x-textureLod(uV,uv-vec2(px.x,0),0.).x+textureLod(uV,uv+vec2(0,px.y),0.).y-textureLod(uV,uv-vec2(0,px.y),0.).y));}`,
jac:`uniform sampler2D uP,uD;void main(){o=vec4((textureLod(uP,uv+vec2(px.x,0),0.).x+textureLod(uP,uv-vec2(px.x,0),0.).x+textureLod(uP,uv+vec2(0,px.y),0.).x+textureLod(uP,uv-vec2(0,px.y),0.).x-textureLod(uD,uv,0.).x)*.25);}`,
grad:`uniform sampler2D uP,uV;void main(){vec2 v=textureLod(uV,uv,0.).xy;v-=.5*vec2(textureLod(uP,uv+vec2(px.x,0),0.).x-textureLod(uP,uv-vec2(px.x,0),0.).x,textureLod(uP,uv+vec2(0,px.y),0.).x-textureLod(uP,uv-vec2(0,px.y),0.).x);o=vec4(v,0,1);}`,
/* two liquids that refuse to mix: advect, then a bistable reaction re-sharpens the boundary; fill level self-balances */
con:`uniform sampler2D uV,uC;uniform float uFill,uDif;
void main(){vec2 v=textureLod(uV,uv,0.).xy;vec2 p=uv-dt*v*vec2(1./asp,1.);vec4 C=textureLod(uC,p,0.);float c=C.r,g=C.g;
float lap=textureLod(uC,p+vec2(px.x,0),0.).r+textureLod(uC,p-vec2(px.x,0),0.).r+textureLod(uC,p+vec2(0,px.y),0.).r+textureLod(uC,p-vec2(0,px.y),0.).r-4.*c;
float mean=textureLod(uC,vec2(.5),12.).r;float bias=clamp((uFill-mean)*4.,-.45,.45);
c+=uDif*lap+.3*c*(1.-c)*(c-.5+bias);
for(int i=0;i<8;i++){float s=sg(i)*uS[i].w;c+=uK[i].x*s;g+=uK[i].w*s;}
g=g*.9985+.0015*noise(vec2(uv.x*asp,uv.y)*5.+uTime*.05);
o=vec4(clamp(c,0.,1.),clamp(g,0.,1.),0,1);}`,
/* surface ripples: wave equation, rings reflect off the screen edge and off the letterforms */
wav:`uniform sampler2D uH;uniform float uDamp,uFirst,uRw,uTxHit;uniform vec2 uGd,uTv;
float nb(vec2 off,float h){vec2 u=uv+off;return tmask(u,2.5)>.5?h:textureLod(uH,u,0.).x;}
void main(){vec2 hw=textureLod(uH,uv,0.).xy;float h=hw.x,w=hw.y;float m=tmask(uv,2.5);
float s=nb(vec2(px.x,0),h)+nb(vec2(-px.x,0),h)+nb(vec2(0,px.y),h)+nb(vec2(0,-px.y),h);
w+=.34*(s-4.*h);w*=uDamp;h=mix(h,s*.25,.03+.1*uRw);
if(uFirst>.5){for(int i=0;i<8;i++)w+=uK[i].y*uS[i].w*sgk(i,1.+1.6*uRw);
 w+=uTxHit*clamp(tmask(uv,5.)*1.6-m,0.,1.)*1.4;
 w+=dot(uGd,vec2((uv.x-.5)*asp,uv.y-.5));
 w+=(m-tmask(uv-uTv*.06*vec2(1./asp,1.),2.5))*length(uTv)*.05;}
h+=w;h*=.9997;if(m>.5){h*=.85;w*=.85;}
o=vec4(clamp(h,-40.,40.),clamp(w,-20.,20.),0,1);}`,
/* shading: wet-glass normals from ripples + liquid bulge, neon membrane, halo, film iridescence, text layer */
ren:`uniform sampler2D uC,uH;uniform vec3 cA,cB,cC,cT,cD;uniform float uMemb,uGloss,uIri,uGlow,uGrain,uRip,uFlash,uBass,uTop,uSub,uBlend,uEdge,uRw,uBgMode,uBgLvl,uBgMove,uMir,uMsz,uMang,uMinv,uPin;
vec2 fold(vec2 u,float m){if(m>.5&&m<1.5||m>2.5)u.x=.5-abs(u.x-.5);if(m>1.5)u.y=.5-abs(u.y-.5);return u;}
vec3 backdrop(vec2 u){vec2 q=vec2(u.x*asp,u.y);float t=uTime*uBgMove;
 if(uBgMode<.5)return vec3(0);
 if(uBgMode<1.5)return cD*uBgLvl;
 if(uBgMode<2.5){float r=length(q-vec2(asp*.5,.5)+.12*vec2(sin(t*.7),cos(t*.5)));return mix(cD,cD*.06,smoothstep(.05,.95,r))*uBgLvl*1.3;}
 if(uBgMode<3.5){vec2 p=q*3.2;float c=0.;for(int i=0;i<3;i++){float f=float(i);p+=vec2(sin(p.y*1.7+t*1.3+f),cos(p.x*1.3-t*1.1+f*1.7))*.6;c+=.06/abs(sin(p.x)*sin(p.y)+.02);}return cD*min(c*c*.08,3.)*uBgLvl;}
 if(uBgMode<4.5){vec2 g=q*26.;vec2 f=fract(g)-.5;float rr=.18+.16*sin(q.x*2.6+t*2.)+.12*sin(q.y*3.4-t*1.6);return cD*smoothstep(rr+.06,rr,length(f))*uBgLvl*1.4;}
 vec2 g=q*9.+vec2(0,t*.8);vec2 d=abs(fract(g)-.5);float l=smoothstep(.465,.5,max(d.x,d.y));return cD*(l*.9+.05)*uBgLvl*1.3;}
vec3 blendT(vec3 col,float tm){vec3 b=cT;
 if(uBlend>4.5)b=abs(col-cT);else if(uBlend>3.5)b=mix(2.*col*cT,1.-2.*(1.-col)*(1.-cT),step(.5,col));else if(uBlend>2.5)b=col*cT;else if(uBlend>1.5)b=1.-(1.-col)*(1.-cT);else if(uBlend>.5)b=min(col+cT,1.);
 return mix(col,b,tm);}
float Ht(vec2 u){return textureLod(uH,u,0.).x*uRip*.5+smoothstep(.2,.8,textureLod(uC,u,0.).r)*1.5;}
void main(){vec2 su=uv;float inv=0.;
if(uMir>3.5){vec2 q=vec2((uv.x-.5)*asp,uv.y-.5);float ca=cos(uMang),sa=sin(uMang);q=mat2(ca,sa,-sa,ca)*q;vec2 cell=floor(q/uMsz);
 float par=mod(cell.x+cell.y,2.);su=fold(uv,par>.5?1.:2.);inv=par*uMinv;}
else if(uMir>.5)su=fold(uv,uMir);
vec2 e=px*(1.3+2.2*uRw);
vec3 n=normalize(vec3(Ht(su-vec2(e.x,0))-Ht(su+vec2(e.x,0)),Ht(su-vec2(0,e.y))-Ht(su+vec2(0,e.y)),1.1));
vec4 C=textureLod(uC,su,0.);float c=C.r,pig=C.g,h=textureLod(uH,su,0.).x;
float liq=smoothstep(.35,.65,c),ed=(c-.5)*mix(8.,2.2,uEdge),edge=exp(-ed*ed),halo=textureLod(uC,su,3.5).r,near=textureLod(uC,su,2.2).r,rim=1.-smoothstep(.6,1.,near);

float dif=clamp(dot(n,L),0.,1.),spec=pow(max(dot(n,Hh),0.),80.),fres=pow(1.-n.z,1.5);

body=mix(body,irid*(.55+.7*dif),uIri);
vec3 voidc=backdrop(su+n.xy*.04*(.4+uRip))*(1.-.35*near)+cB*(.03+.2*halo*halo+.5*fres)+mix(cB,irid,uIri)*fres*.35;
vec3 liqc=body*((mix(1.,.07,uMemb)+uMemb*rim*rim*.9)*(.45+.8*dif)+fres*.7);
vec3 col=mix(voidc,liqc,liq);
col+=mix(body,vec3(1),.35)*edge*(1.25+uFlash*1.6);col+=cA*near*near*(1.-liq)*(.35+.4*uGlow);
col+=cA*halo*uGlow*(.16+.5*uBass);
col+=mix(cB,vec3(1),.5+.5*liq)*spec*uGloss*(.35+.65*liq);
col=1.-exp(-col*1.5);
col=mix(col,1.-col,inv);
if(uPin<.5)col=blendT(col,tmask(uv+n.xy*uSub*.035*(.3+liq),0.)*uTop);
col+=(hash(gl_FragCoord.xy*.37+fract(uTime)*91.)-.5)*uGrain*.11;
vec2 vq=uv-.5;col*=1.-.5*dot(vq,vq);

};
function prog(fs){const p=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,HEAD+fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}
 gl.linkProgram(p);const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name);}return{p,u};}

let SW=0,SH=0,ASP=1,V,Pr,D,C,H;
function run(pr,target,un){gl.useProgram(pr.p);let unit=0;for(const k in un){const l=pr.u[k];if(l==null)continue;const v=un[k];
  if(v instanceof WebGLTexture){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,v);gl.uniform1i(l,unit++);}
